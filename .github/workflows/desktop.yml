# Builds the GIS Consultant Studio desktop app (Tauri 2) for Windows.
#
# Every push that touches the app builds the installers and keeps them as a
# workflow artifact ("ploots-click-windows"). Pushing a tag like
# desktop-v1.0.0 also publishes them on a GitHub release.
#
# Only the app's code is built here; no user data is involved.
name: Desktop app

on:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "js/**"
      - "vendor/**"
      - "index.html"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# A newer push cancels the build of the one before it.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache downloads and Rust build
        uses: actions/cache@v4
        with:
          path: |
            desktop/.cache
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Build the offline web app (desktop/dist)
        run: |
          python -m pip install rjsmin rcssmin
          python desktop/build_dist.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build the installers
        working-directory: desktop
        run: tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ploots-click-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ploots Click ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
