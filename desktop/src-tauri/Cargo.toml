[package]
name = "ploots-click"
version = "1.1.0"
description = "GIS Consultant Studio desktop: charts, maps and page layout, offline"
authors = ["Defani Arman"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ploots_click_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
